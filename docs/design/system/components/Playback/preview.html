<head>

<style>
/* Fallback copy of the tokens, so this card still renders if the system token sheet is not loaded.
   It sits in a cascade layer, so the system's own tokens always win. Never copy this block into the product. */

:root {
  --color-bg: #0e0e0e;
  --color-surround: var(--color-bg);
  --color-surface: #1c1c1c;
  --color-surface-raised: #262626;
  --color-pressed: #3a3a3a;
  --color-line: #333333;
  --color-line-strong: #767676;
  --color-text: #f0f0f0;
  --color-text-muted: #b4b4b4;
  --color-text-disabled: #767676;
  --color-accent: #f0f0f0;
  --color-accent-hover: #ffffff;
  --color-accent-pressed: #c8c8c8;
  --color-on-accent: #0e0e0e;
  --color-focus: #ffffff;
  --ramp-black: #000000;
  --ramp-white: #ffffff;
  --nodata-a: #2b2b2b;
  --nodata-b: #a3a3a3;
  --epoch-a: #ff6600;
  --epoch-b: #0099ff;
  --diff-earlier-5: #fea578;
  --diff-earlier-4: #f46e0e;
  --diff-earlier-3: #c25508;
  --diff-earlier-2: #8f4111;
  --diff-earlier-1: #5b301a;
  --diff-zero: #222222;
  --diff-later-1: #1d3f60;
  --diff-later-2: #175d9b;
  --diff-later-3: #0d7dd4;
  --diff-later-4: #39a0fd;
  --diff-later-5: #8ac3fe;
  --series-1: #ff6600;
  --series-2: #fea578;
  --series-3: #d4d4d4;
  --series-4: #8ac3fe;
  --series-5: #0099ff;
  --marker-position: #ffffff;
  --marker-gaia: #3ce074;
  --marker-catwise: #fe6ec7;
  --marker-was: #fce343;
  --marker-casing: #000000;
  --spotlight-dim: rgba(0, 0, 0, 0.62);
  --channel-r: #ff0000;
  --channel-g: #00ff00;
  --channel-b: #0000ff;
  --space-half: 2px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-0: 0;
  --radius-1: 2px;
  --radius-2: 4px;
  --text-micro: 0.75rem;
  --text-caption: 0.8125rem;
  --text-label: 0.875rem;
  --text-body: 1rem;

  --text-title: 1.375rem;

  --leading-caption: 1.125rem;
  --leading-label: 1.25rem;
  --leading-body: 1.5rem;
  --leading-title: 1.75rem;
  --weight-regular: 400;
  --weight-strong: 600;
  --numeric: tabular-nums lining-nums slashed-zero;
  --border-hair: 1px;
  --border-strong: 2px;
  --focus-width: 2px;
  --focus-gap: 2px;
  --size-touch: 44px;

  --blink-rate-max: 6;

<style>
  /* layout of this reference card only; not part of the system */
  body { padding: var(--space-4); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-5); }
  .pv-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); align-content: start; min-width: 0; }
  .pv-state { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); align-content: start; min-width: 0; }
  .pv-cap, .pv-state > figcaption { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--color-text-muted); }
  .pv-phone { width: 100%; max-width: 358px; }
  .pv-half { width: 100%; max-width: 280px; }
  .pv-wide { width: 100%; max-width: 640px; }
  .pv-sep { height: var(--border-hair); margin: var(--space-4) 0; background: var(--color-line); }
</style>
</head>
<body>
<div class="pv-row">
  <figure class="pv-state pv-phone">
    <div class="bc-playback">
      <button class="bc-flip" type="button" aria-pressed="false"><i data-icon="flip"></i>Hold to flip</button>
      <div class="bc-transport">
        <button class="bc-button bc-button--icon" type="button" aria-label="Previous frame"><i data-icon="previous"></i></button>
        <button class="bc-button bc-button--icon" type="button" aria-label="Play" aria-pressed="false"><i data-icon="play"></i></button>
        <button class="bc-button bc-button--icon" type="button" aria-label="Next frame"><i data-icon="next"></i></button>
        <span class="bc-transport__count">Frame 2 of 4</span>
      </div>
      <div class="bc-speed">
        <label for="pb-speed">Speed</label>
        <div>
          <input class="bc-slider" id="pb-speed" type="range" min="1" max="6" step="1" value="2" data-output="pb-speed-out" data-unit=" per second">
          <div class="bc-ticks bc-ticks--labelled" aria-hidden="true"><span><i>1</i></span><span><i>2</i></span><span><i>3</i></span><span><i>4</i></span><span><i>5</i></span><span><i>6</i></span></div>
        </div>
        <output class="bc-fixed" style="--bc-ch: 12" id="pb-speed-out" for="pb-speed">2 per second</output>
      </div>
    </div>
    <figcaption>At rest. Nothing plays until the reader presses play. Try holding the flip key.</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-playback">
      <span class="bc-flip"><i data-icon="flip"></i>Hold to flip</span>
      <div class="bc-transport">
        <span class="bc-button bc-button--icon"><i data-icon="previous"></i></span>
        <span class="bc-button bc-button--icon" aria-pressed="true"><i data-icon="pause"></i></span>
        <span class="bc-button bc-button--icon"><i data-icon="next"></i></span>
        <span class="bc-transport__count">Frame 3 of 4</span>
      </div>
    </div>
    <figcaption>Playing: the button shows pause and is lit. The counter changes one digit in place.</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-playback">
      <span class="bc-flip is-pressed"><i data-icon="flip"></i>Hold to flip</span>
    </div>
    <figcaption>Flip key held: a 2px inset line and nothing else, so no large area changes as the image changes</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-playback">
      <span class="bc-flip is-focus"><i data-icon="flip"></i>Hold to flip</span>
    </div>
    <figcaption>Keyboard focus. Hold Space or Enter to flip.</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-playback">
      <button class="bc-flip" type="button" aria-pressed="false"><i data-icon="flip"></i>Hold to flip</button>
      <div class="bc-transport">
        <button class="bc-button bc-button--icon" type="button" aria-label="Previous frame"><i data-icon="previous"></i></button>
        <button class="bc-button bc-button--icon" type="button" aria-label="Next frame"><i data-icon="next"></i></button>
        <span class="bc-transport__count">Frame 2 of 4</span>
      </div>
      <p class="bc-note">Reduced motion is on, so frames change only when you step or hold.</p>
    </div>
    <figcaption>Reduced motion: no play button and no speed. Stepping and holding stay.</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-playback">
      <button class="bc-flip" type="button" disabled><i data-icon="flip"></i>Hold to flip</button>
      <div class="bc-transport">
        <button class="bc-button bc-button--icon" type="button" aria-label="Previous frame" disabled><i data-icon="previous"></i></button>
        <button class="bc-button bc-button--icon" type="button" aria-label="Play" disabled><i data-icon="play"></i></button>
        <button class="bc-button bc-button--icon" type="button" aria-label="Next frame" disabled><i data-icon="next"></i></button>
        <span class="bc-transport__count">Frame 1 of 1</span>
      </div>
      <p class="bc-note">Only one frame covers this position, so there is nothing to blink yet.</p>
    </div>
    <figcaption>Disabled, with the reason</figcaption>
  </figure>
</div>
<script>
if (window.Comparator) { Comparator.enhance(document); }
</script>
</body>
</html>
