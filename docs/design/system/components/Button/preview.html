<style>
  /* layout of this reference card only; not part of the system */
  body { padding: var(--space-4); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-5); }
  .pv-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); align-content: start; min-width: 0; }
  .pv-state { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); align-content: start; min-width: 0; }
  .pv-cap, .pv-state > figcaption { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--color-text-muted); }
  .pv-phone { width: 100%; max-width: 358px; }
  .pv-half { width: 100%; max-width: 280px; }
  .pv-wide { width: 100%; max-width: 640px; }
  .pv-sep { height: var(--border-hair); margin: var(--space-4) 0; background: var(--color-line); }

  .bt-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-4) var(--space-4); }
  .bt-row + .bt-row { margin-top: var(--space-4); }
  .bt-row > .pv-cap { flex: 0 0 100%; }

<body>
<div class="bt-row">
  <span class="pv-cap">Primary: one per view</span>
  <figure class="pv-state"><button class="bc-button bc-button--primary" type="button">Search</button><figcaption>Default</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--primary is-hover" type="button">Search</button><figcaption>Hover</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--primary is-focus" type="button">Search</button><figcaption>Keyboard focus</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--primary is-pressed" type="button">Search</button><figcaption>Pressed</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--primary" type="button" disabled>Search</button><figcaption>Disabled</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--primary" type="button" aria-busy="true">Searching…</button><figcaption>Loading</figcaption></figure>
</div>
<div class="bt-row">
  <span class="pv-cap">Secondary: the default button</span>
  <figure class="pv-state"><button class="bc-button" type="button">Download CSV</button><figcaption>Default</figcaption></figure>
  <figure class="pv-state"><button class="bc-button is-hover" type="button">Download CSV</button><figcaption>Hover</figcaption></figure>
  <figure class="pv-state"><button class="bc-button is-focus" type="button">Download CSV</button><figcaption>Keyboard focus</figcaption></figure>
  <figure class="pv-state"><button class="bc-button is-pressed" type="button">Download CSV</button><figcaption>Pressed</figcaption></figure>
  <figure class="pv-state"><button class="bc-button" type="button" disabled>Download CSV</button><figcaption>Disabled</figcaption></figure>
  <figure class="pv-state"><button class="bc-button" type="button" aria-busy="true">Preparing CSV…</button><figcaption>Loading</figcaption></figure>
</div>
<div class="bt-row">
  <span class="pv-cap">Quiet, and icon-only (always with an accessible name)</span>
  <figure class="pv-state"><button class="bc-button bc-button--quiet" type="button"><i data-icon="copy-link"></i>Copy link</button><figcaption>Default</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--quiet is-hover" type="button"><i data-icon="copy-link"></i>Copy link</button><figcaption>Hover</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--quiet is-focus" type="button"><i data-icon="copy-link"></i>Copy link</button><figcaption>Keyboard focus</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--icon" type="button" aria-label="Next frame"><i data-icon="next"></i></button><figcaption>Icon-only</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--icon is-pressed" type="button" aria-label="Next frame"><i data-icon="next"></i></button><figcaption>Pressed</figcaption></figure>
  <figure class="pv-state"><button class="bc-button bc-button--icon" type="button" aria-label="Next frame" disabled><i data-icon="next"></i></button><figcaption>Disabled</figcaption></figure>
</div>
<div class="bt-row">
  <span class="pv-cap">Text link, and a long label in a narrow place</span>
  <figure class="pv-state"><a class="bc-link" href="#top">How the image is built</a><figcaption>Default</figcaption></figure>
  <figure class="pv-state"><a class="bc-link is-hover" href="#top">How the image is built</a><figcaption>Hover</figcaption></figure>
  <figure class="pv-state"><a class="bc-link is-focus" href="#top">How the image is built</a><figcaption>Keyboard focus</figcaption></figure>
  <figure class="pv-state"><a class="bc-link" href="#top">10.26131/IRSA652<i data-icon="external-link"></i></a><figcaption>Leaves the tool</figcaption></figure>
  <figure class="pv-state" style="width: 9.5rem"><button class="bc-button bc-button--primary" type="button">Go to where it is now</button><figcaption>Wraps, never truncates</figcaption></figure>
</div>
