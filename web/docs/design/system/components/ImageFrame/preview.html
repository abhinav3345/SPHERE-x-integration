<style>
  /* layout of this reference card only; not part of the system */
  body { padding: var(--space-4); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-5); }
  .pv-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); align-content: start; min-width: 0; }
  .pv-state { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); align-content: start; min-width: 0; }
  .pv-cap, .pv-state > figcaption { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--color-text-muted); }
  .pv-phone { width: 100%; max-width: 358px; }
  .pv-half { width: 100%; max-width: 280px; }
  .pv-wide { width: 100%; max-width: 640px; }
  .pv-sep { height: var(--border-hair); margin: var(--space-4) 0; background: var(--color-line); }
</style>

<body>
<div class="pv-row">
  <figure class="pv-state pv-phone">
    <div>
      <div class="bc-frame" tabindex="0" role="group" aria-label="Sky image, 31 Oct to 14 Nov 2025, 4.41 to 5.00 micrometres. Arrow keys move the readout by one pixel.">
        <div class="bc-frame__stage"><div class="bc-frame__plate">
          <canvas class="bc-frame__image" id="if-main" data-frame="119" data-fill="52"></canvas>
          <svg class="bc-frame__overlay" aria-hidden="true" data-markers='[["track",[[0.24,0.34],[0.33,0.31],[0.42,0.28],[0.51,0.25]]],["gaia",0.42,0.28,"Gaia"],["catwise",0.76,0.60,"CatWISE"],["was",0.22,0.72,"2010"],["position",0.5,0.5]]'></svg>
          <span class="bc-frame__label"><span>real frame, 119 × 119 px</span></span>
        </div></div>
      </div>
      <div class="bc-framefoot">
        <span class="bc-scalebar" data-scalebar="60" data-for="if-main"></span>
        <i data-compass></i>
      </div>
      <p class="bc-readout">
        <span class="bc-readout__field" style="--bc-ch: 14"><span class="bc-readout__key">RA </span>133.75977°</span>
        <span class="bc-readout__field" style="--bc-ch: 13"><span class="bc-readout__key">Dec </span>−7.24183°</span>
        <span class="bc-readout__field" style="--bc-ch: 12">0.142 MJy/sr</span>
      </p>
    </div>
    <figcaption>The frame at phone width: image at a whole number of device pixels per image pixel, markers over it, scale bar and compass in the margin, readout in fixed fields.</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div>
      <div class="bc-frame is-focus" role="group" aria-label="Sky image with the spotlight on">
        <div class="bc-frame__stage"><div class="bc-frame__plate">
          <canvas class="bc-frame__image" id="if-spot" data-frame="119" data-fill="52"></canvas>
          <svg class="bc-frame__overlay" aria-hidden="true" data-markers='[["spotlight",0.5,0.5,70],["position",0.5,0.5]]'></svg>
          <span class="bc-frame__label"><span>real frame, 119 × 119 px</span></span>
        </div></div>
      </div>
      <div class="bc-framefoot">
        <span class="bc-scalebar" data-scalebar="60" data-for="if-spot"></span>
        <i data-compass></i>
      </div>
      <p class="bc-readout">
        <span class="bc-readout__field" style="--bc-ch: 14"><span class="bc-readout__key">RA </span>        —</span>
        <span class="bc-readout__field" style="--bc-ch: 13"><span class="bc-readout__key">Dec </span>       —</span>
        <span class="bc-readout__field" style="--bc-ch: 12">           —</span>
      </p>
    </div>
    <figcaption>Keyboard focus (ring inside the frame edge) with the spotlight on. No pixel is under the cursor, so the fields hold a dash and keep their width.</figcaption>
  </figure>
  <figure class="pv-state pv-half">
    <div class="bc-frame bc-frame--survey" role="group" aria-label="Image from another survey">
      <div class="bc-frame__stage"><div class="bc-frame__plate">
        <canvas class="bc-frame__image" data-frame="119" data-fill="52"></canvas>
        <span class="bc-frame__label"><span>real frame, WISE W2, 2010</span></span>
      </div></div>
    </div>
    <figcaption>A frame from another survey: dashed outline</figcaption>
  </figure>
</div>
