<title>SearchField — preview</title>

<style>

   It sits in a cascade layer, so the system's own tokens always win. Never copy this block into the product. */

:root {
  --color-bg: #0e0e0e;
  --color-surround: var(--color-bg);
  --color-surface: #1c1c1c;
  --color-surface-raised: #262626;
  --color-pressed: #3a3a3a;
  --color-line: #333333;
  --color-line-strong: #767676;
  --color-text: #f0f0f0;
  --color-text-muted: #b4b4b4;
  --color-text-disabled: #767676;
  --color-accent: #f0f0f0;
  --color-accent-hover: #ffffff;
  --color-accent-pressed: #c8c8c8;
  --color-on-accent: #0e0e0e;
  --color-focus: #ffffff;
  --ramp-black: #000000;
  --ramp-white: #ffffff;
  --nodata-a: #2b2b2b;
  --nodata-b: #a3a3a3;
  --epoch-a: #ff6600;
  --epoch-b: #0099ff;
  --diff-earlier-5: #fea578;
  --diff-earlier-4: #f46e0e;
  --diff-earlier-3: #c25508;
  --diff-earlier-2: #8f4111;
  --diff-earlier-1: #5b301a;
  --diff-zero: #222222;
  --diff-later-1: #1d3f60;
  --diff-later-2: #175d9b;
  --diff-later-3: #0d7dd4;
  --diff-later-4: #39a0fd;
  --diff-later-5: #8ac3fe;
  --series-1: #ff6600;
  --series-2: #fea578;
  --series-3: #d4d4d4;
  --series-4: #8ac3fe;
  --series-5: #0099ff;
  --marker-position: #ffffff;
  --marker-gaia: #3ce074;
  --marker-catwise: #fe6ec7;
  --marker-was: #fce343;
  --marker-casing: #000000;
  --spotlight-dim: rgba(0, 0, 0, 0.62);
  --channel-r: #ff0000;
  --channel-g: #00ff00;
  --channel-b: #0000ff;
  --space-half: 2px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-0: 0;
  --radius-1: 2px;
  --radius-2: 4px;
  --text-micro: 0.75rem;
  --text-caption: 0.8125rem;
  --text-label: 0.875rem;
  --text-body: 1rem;

  --leading-label: 1.25rem;
  --leading-body: 1.5rem;
  --leading-title: 1.75rem;
  --weight-regular: 400;
  --weight-strong: 600;
  --numeric: tabular-nums lining-nums slashed-zero;

<style>
  /* layout of this reference card only; not part of the system */
  body { padding: var(--space-4); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-5); }
  .pv-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-4); align-content: start; min-width: 0; }
  .pv-state { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--space-2); align-content: start; min-width: 0; }
  .pv-cap, .pv-state > figcaption { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--color-text-muted); }
  .pv-phone { width: 100%; max-width: 358px; }
  .pv-half { width: 100%; max-width: 280px; }
  .pv-wide { width: 100%; max-width: 640px; }
  .pv-sep { height: var(--border-hair); margin: var(--space-4) 0; background: var(--color-line); }
</style>
</head>
<body>
<div class="pv-row">
  <figure class="pv-state pv-phone">
    <form class="bc-search" role="search" onsubmit="return false">
      <div class="bc-field">
        <label class="bc-label" for="q-default">Sky position or name</label>
        <input class="bc-input" id="q-default" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" placeholder="133.7599 -7.2418" aria-describedby="q-default-msg">
        <button class="bc-button bc-button--primary" type="submit">Search</button>
        <p class="bc-fieldmsg" id="q-default-msg">Try 133.7599 -7.2418, 08h55m10.831s -07d14m42.53s or Barnard's Star.</p>
      </div>
    </form>
    <figcaption>Default. The hint shows all three accepted forms.</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-search">
      <div class="bc-field">
        <label class="bc-label" for="q-hover">Sky position or name</label>
        <input class="bc-input is-hover" id="q-hover" type="text" placeholder="133.7599 -7.2418" tabindex="-1" aria-describedby="q-hover-msg">
        <button class="bc-button bc-button--primary" type="button" tabindex="-1">Search</button>
        <p class="bc-fieldmsg" id="q-hover-msg">Try 133.7599 -7.2418, 08h55m10.831s -07d14m42.53s or Barnard's Star.</p>
      </div>
    </div>
    <figcaption>Hover: the outline brightens</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-search">
      <div class="bc-field">
        <label class="bc-label" for="q-focus">Sky position or name</label>
        <input class="bc-input is-focus" id="q-focus" type="text" value="Barnard's Star" tabindex="-1" aria-describedby="q-focus-msg">
        <button class="bc-button bc-button--primary" type="button" tabindex="-1">Search</button>
        <p class="bc-fieldmsg" id="q-focus-msg">Try 133.7599 -7.2418, 08h55m10.831s -07d14m42.53s or Barnard's Star.</p>
      </div>
    </div>
    <figcaption>Keyboard focus, with a name typed</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-search">
      <div class="bc-field">
        <label class="bc-label" for="q-filled">Sky position or name</label>
        <input class="bc-input" id="q-filled" type="text" value="08h55m10.831s -07d14m42.53s" tabindex="-1" aria-describedby="q-filled-msg">
        <button class="bc-button bc-button--primary" type="button" tabindex="-1">Search</button>
        <p class="bc-fieldmsg" id="q-filled-msg">Read as RA 133.79513°, Dec −7.24515°.</p>
      </div>
    </div>
    <figcaption>Filled. The message says how the entry was understood.</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-search">
      <div class="bc-field">
        <label class="bc-label" for="q-error">Sky position or name</label>
        <input class="bc-input" id="q-error" type="text" value="133.7599 -97.2418" tabindex="-1" aria-invalid="true" aria-describedby="q-error-msg">
        <button class="bc-button bc-button--primary" type="button" tabindex="-1">Search</button>
        <p class="bc-fieldmsg bc-fieldmsg--error" id="q-error-msg" role="alert"><i data-icon="warning" data-label="Error"></i><span>Declination must be between −90 and +90 degrees.</span></p>
      </div>
    </div>
    <figcaption>Error: heavier outline, warning icon, and what to fix. The entry stays as typed.</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-search">
      <div class="bc-field">
        <label class="bc-label" for="q-busy">Sky position or name</label>
        <input class="bc-input" id="q-busy" type="text" value="Barnard's Star" readonly tabindex="-1" aria-describedby="q-busy-msg">
        <button class="bc-button bc-button--primary" type="button" tabindex="-1" aria-busy="true">Searching…</button>
        <p class="bc-fieldmsg" id="q-busy-msg" role="status">Looking up the name.</p>
      </div>
    </div>
    <figcaption>Loading: words, not a spinner</figcaption>
  </figure>
  <figure class="pv-state pv-phone">
    <div class="bc-search">
      <div class="bc-field">
        <label class="bc-label" for="q-off">Sky position or name</label>
        <input class="bc-input" id="q-off" type="text" placeholder="133.7599 -7.2418" disabled aria-describedby="q-off-msg">
        <button class="bc-button bc-button--primary" type="button" disabled>Search</button>
        <p class="bc-fieldmsg" id="q-off-msg">Search is off while the recorded field is shown.</p>
      </div>
    </div>
    <figcaption>Disabled, with the reason</figcaption>
  </figure>
</div>
<script>
if (window.Comparator) { Comparator.enhance(document); }
</script>
</body>
</html>
