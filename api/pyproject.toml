[project]
name = "tombaugh"
version = "0.3.0"
description = "Tombaugh API: registered, wavelength-matched SPHEREx stacks for any sky position. Built with AI assistance; see docs/AI_USE.md."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=2.0",
  "scipy>=1.13",
  "astropy>=7.0",
  "requests>=2.32",
  "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "reproject>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tombaugh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs live archive access (deselected by default and in CI)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py312"
